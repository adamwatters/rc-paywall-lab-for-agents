# Unit tests: DSL → lint contract, every lint rule, render output, init/detect-sdk
# from fixtures. Stdlib only, no simulator. Screenshot verification stays manual
# (see docs/platforms.md) until CI runners with simulators are worth their cost.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest -v
